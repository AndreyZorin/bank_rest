components:
  schemas:
    RoleRequest:
      type: object
      properties:
        name:
          type: string
          enum:
            - ADMIN
            - USER
      required:
        - name
    UserRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        username:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRequest'
          uniqueItems: true
    RoleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          enum:
            - ADMIN
            - USER
    UserInfo:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
          uniqueItems: true
    UserResponse:
      type: object
      properties:
        operationStatus:
          type: string
          enum:
            - COMPLETED
            - ERROR
        responseId:
          type: string
        userInfoList:
          type: array
          items:
            $ref: '#/components/schemas/UserInfo'
    ErrorResponse:
      type: object
      properties:
        operationStatus:
          type: string
          enum:
            - COMPLETED
            - ERROR
        responseId:
          type: string
        errorMessage:
          type: string
    TransactionRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        cardNumberSource:
          type: string
        cardNumberTarget:
          type: string
        sum:
          type: number
    TransactionResponse:
      type: object
      properties:
        operationStatus:
          type: string
          enum:
            - COMPLETED
            - ERROR
        responseId:
          type: string
        cardNumberSource:
          type: string
        balanceSource:
          type: number
        cardNumberTarget:
          type: string
        balanceTarget:
          type: number
        sum:
          type: number
    CardRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        cardId:
          type: integer
          format: int64
        cardNumber:
          type: string
        ownerUsername:
          type: string
        ownerFullName:
          type: string
        userId:
          type: integer
          format: int64
        validityPeriod:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - EXPIRED
        balance:
          type: number
    CardInfo:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
        cardNumber:
          type: string
        ownerUsername:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        validityPeriod:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - EXPIRED
        balance:
          type: number
    CardResponse:
      type: object
      properties:
        operationStatus:
          type: string
          enum:
            - COMPLETED
            - ERROR
        responseId:
          type: string
        cardInfoList:
          type: array
          items:
            $ref: '#/components/schemas/CardInfo'
    RefreshJwtRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
        - requestId
    JwtResponse:
      type: object
      properties:
        operationStatus:
          type: string
          enum:
            - COMPLETED
            - ERROR
        responseId:
          type: string
        type:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
    JwtRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - login
        - password
        - requestId
  securitySchemes:
    JWT:
      type: http
      in: header
      scheme: bearer
      bearerFormat: 'Bearer '
