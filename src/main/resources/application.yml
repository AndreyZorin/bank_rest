spring:
  application:
    name: bank_rest

  profiles:
    active: local

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL}/${DB_NAME}?currentSchema=${DB_SCHEMA}&targetServerType=primary&rewriteBatchedInserts=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      pool-name: datasource-pool-${spring.application.name}
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        reWriteBatchedInsert: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        format_sql: true
        order_inserts: true
        order_updates: true
    open-in-view: false
    show-sql: false
  liquibase:
    contexts: default
    default-schema: ${DB_SCHEMA}
    change-log: classpath:/db/migration/db.changelog-master.yaml

  cors:
    url:
      configurations:
        # Настройки CORS для путей, начинающихся с /api
        "[/api/**]":
          allowed-origins:
            - http://localhost:8081
          allowed-methods:
            - GET
            - POST
            - PATCH
            - DELETE
          allowed-headers:
            - Authorization
            - Content-Type
          max-age: 10
          allow-credentials: true
        # Для всех запросов разрешаются CORS-запросы:
        "[/**]":
          # - с сайта http://localhost:8080
          allowed-origins:
            - http://localhost:8080
          # - с методами GET и POST
          allowed-methods:
            - GET
            - POST
          # - с нестандартными заголовками Authorization и Content-Type
          allowed-headers:
            - Authorization
            - Content-Type
          # - с передачей учётных данных
          allow-credentials: true
          # JavaScript может обращаться к заголовку X-CUSTOM-HEADER ответа
          exposed-headers:
            - X-CUSTOM-HEADER
          # Браузер может кешировать настройки CORS на 10 секунд
          max-age: 10

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED}
  api-docs:
    path: /api-docs

