spring:
  application:
    name: bank_rest

#  profiles:
#    active: local

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL:localhost:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}&targetServerType=primary&rewriteBatchedInserts=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      pool-name: datasource-pool-${spring.application.name}
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        reWriteBatchedInsert: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        format_sql: true
        order_inserts: true
        order_updates: true
    open-in-view: false
    show-sql: false
  liquibase:
    contexts: default
    default-schema: ${DB_SCHEMA:public}
    change-log: classpath:/db/migration/db.changelog-master.yaml

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /api-docs

